backend:
  name: github
  repo: seasonZhu/seasonZhu.github.io
  branch: main

local_backend: true
locale: zh_Hans
site_url: https://seasonzhu.github.io
display_url: https://seasonzhu.github.io
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - label: 发布日期
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新日期
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: 栏目
        name: category
        widget: select
        options: [技术, 厨房, 旅行, ACG, 随笔]
        required: false
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 封面, name: image, widget: image, required: false, default: "" }
      - { label: 草稿, name: draft, widget: boolean, default: true }
      - { label: 正文, name: body, widget: markdown }
