backend:
  name: github
  repo: seasonZhu/seasonZhu.github.io
  branch: main
  site_domain: seasonzhu.netlify.app

local_backend: true
publish_mode: editorial_workflow
locale: zh_Hans
site_url: https://seasonzhu.github.io
display_url: https://seasonzhu.github.io
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{title}} · {{category}} · {{published}}"
    sortable_fields:
      - title
      - { field: published, label: 发布日期, default_sort: desc }
    view_groups:
      - { label: 按栏目, field: category }
    view_filters:
      - { label: 标记为草稿, field: draft, pattern: true }
    fields:
      - { label: 标题, name: title, widget: string }
      - label: 短链接名
        name: permalink
        widget: string
        required: false
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "请使用小写英文字母、数字和短横线"]
        hint: "新文章可选填，例如 swift-notes。留空使用标题生成的地址。发布后建议保留原值。"
      - { label: 首页置顶, name: pinned, widget: boolean, default: false, required: false }
      - { label: 摘要, name: description, widget: text }
      - label: 发布日期
        name: published
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - label: 更新日期
        name: updated
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: 栏目
        name: category
        widget: select
        options: [技术, 厨房, 旅行, ACG, 随笔]
        required: false
      - { label: 标签, name: tags, widget: list, required: false }
      - { label: 封面, name: image, widget: image, required: false, default: "" }
      - { label: 草稿, name: draft, widget: boolean, default: false, hint: "开启后正式站点隐藏文章。暂存未发布稿件请使用工作流。" }
      - { label: 正文, name: body, widget: season-writing }
  - name: pages
    label: 固定页面
    label_singular: 固定页
    folder: src/content/pages
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: "pages/{{slug}}/"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 显示在顶部导航, name: showInNav, widget: boolean, default: true, required: false }
      - { label: 导航排序, name: navOrder, widget: number, value_type: int, default: 0, required: false, hint: "数字越小越靠前，相同则按标题排序。" }
      - { label: 正文, name: body, widget: markdown }
  - name: protected_pages
    label: 站点页面
    delete: false
    files:
      - file: src/content/spec/about.md
        name: about
        label: 关于页
        preview_path: about/
        fields:
          - { label: 正文, name: body, widget: markdown }
      - file: src/data/appearance.json
        name: appearance
        label: 站点外观
        format: json
        preview_path: "/"
        fields:
          - label: 配色预设
            name: preset
            widget: select
            default: starry
            options:
              - { label: 星间夜色（蓝紫）, value: starry }
              - { label: 琥珀街景（暖橙）, value: amber }
          - { label: 头像, name: avatar, widget: image, required: false, hint: "上传图片或填写 HTTPS 直链。清空后恢复默认头像。" }
          - { label: 顶部横幅, name: banner, widget: image, required: false, hint: "上传横图或填写 HTTPS 直链。清空后使用所选配色预设的默认横幅。" }
          - label: 横幅裁剪位置
            name: bannerPosition
            widget: select
            default: center
            options:
              - { label: 居中, value: center }
              - { label: 顶部, value: top }
              - { label: 底部, value: bottom }
      - file: src/data/profile.json
        name: profile
        label: 站点资料
        format: json
        preview_path: "/"
        fields:
          - { label: 站点名称, name: title, widget: string }
          - { label: 副标题, name: subtitle, widget: string, required: false }
          - { label: 作者名称, name: name, widget: string }
          - { label: 侧栏简介, name: bio, widget: text, required: false }
          - label: 社交链接
            name: links
            widget: list
            required: false
            fields:
              - { label: 名称, name: name, widget: string }
              - { label: 链接, name: url, widget: string, pattern: ['^https://[^ ]+$', '请输入 HTTPS 链接'] }
      - file: public/admin/writing-templates.json
        name: writing_templates
        label: 写作模板
        format: json
        fields:
          - label: 模板列表
            name: templates
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: 模板名称, name: name, widget: string }
              - { label: Markdown 内容, name: body, widget: text }
